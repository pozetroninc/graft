[files]
extend-exclude = [
 "context7.json",
 # Vendored upstream crate — don't spellcheck code we don't own
 "patches/fjall/**",
]

[default]
extend-ignore-re = [
  # ignore gids
  "[1-9A-HJ-NP-Za-km-z]{10}-[1-9A-HJ-NP-Za-km-z]{13}"
]

[default.extend-words]
# Apple's Unique Device Identifier (used in iOS tooling)
udid = "udid"
