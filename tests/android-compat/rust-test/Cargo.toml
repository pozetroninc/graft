[package]
name = "graft-android-test"
version = "0.1.0"
edition = "2024"

[workspace]

[[bin]]
name = "graft-android-test"
path = "src/main.rs"

[[bin]]
name = "graft-lock-test"
path = "src/lock_test.rs"

[patch.crates-io]
# Patch fjall to use fcntl-based file locking on Android, where flock() is
# unsupported by Bionic libc (returns ENOTSUP).
fjall = { path = "../../../patches/fjall" }

[dependencies]
graft = { path = "../../../crates/graft", features = ["testutil"] }
graft-sqlite = { path = "../../../crates/graft-sqlite" }
graft-tracing = { path = "../../../crates/graft-tracing" }

bytes = "1"
precept = { version = "0.3.0", features = ["enabled"] }
rand = "0.10"
rusqlite = { version = "0.38", features = ["bundled"] }
sqlite-plugin = { version = "0.9.0", default-features = false, features = ["static"] }
static_assertions = "1.1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync"] }
